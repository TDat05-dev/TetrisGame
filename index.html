<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tetris</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cols: 10;
            --rows: 20;
            --cell-size: 30px;

            --c1: #FF8E0D;
            --c2: #0DFF72;
            --c3: #F538FF;
            --c4: #0DC2FF;
            --c5: #3877FF;
            --c6: #FFE138;
            --c7: #FF0D72;
            --c8: #6B6B80;
            --c9: #FF3B30;

            --panel-bg: #1a1a24;
            --panel-border: #33334d;
            --text-muted: #8888a0;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .play-area {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        .board-wrapper {
            position: relative;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 140px;
        }

        .info-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
        }

        .info-box[hidden] {
            display: none;
        }

        .info-label {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .score-value {
            color: #ff007f;
        }

        .level-value {
            color: #00f0ff;
        }

        .next-grid {
            display: grid;
            grid-template-columns: repeat(4, var(--cell-size));
            grid-template-rows: repeat(4, var(--cell-size));
            margin-top: 4px;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(var(--cols), var(--cell-size));
            grid-template-rows: repeat(var(--rows), var(--cell-size));
            background-color: #000000;
            border: 3px solid var(--panel-border);
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            user-select: none;
        }

        .cell {
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .cell:not([data-v="0"]) {
            box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px rgba(255, 255, 255, 0.15);
        }

        .cell[data-v="1"] { background-color: var(--c1); }
        .cell[data-v="2"] { background-color: var(--c2); }
        .cell[data-v="3"] { background-color: var(--c3); }
        .cell[data-v="4"] { background-color: var(--c4); }
        .cell[data-v="5"] { background-color: var(--c5); }
        .cell[data-v="6"] { background-color: var(--c6); }
        .cell[data-v="7"] { background-color: var(--c7); }
        .cell[data-v="8"] { background-color: var(--c8); }

        .cell[data-v="9"] {
            background: radial-gradient(circle, #FFE138 0%, var(--c9) 55%, #8B0000 100%);
            box-shadow: inset 0 0 0 1px #000, 0 0 8px rgba(255, 59, 48, 0.8);
        }

        .cell[data-v="10"] {
            background: repeating-linear-gradient(45deg, #b8c2d6 0px, #b8c2d6 4px, #7a8499 4px, #7a8499 8px);
            box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px #e6ecf5;
        }

        .cell[data-v="11"] {
            background: linear-gradient(135deg, #7a8499 44%, #1a1a24 46%, #1a1a24 54%, #7a8499 56%);
            box-shadow: inset 0 0 0 1px #000;
        }

        .banner {
            position: absolute;
            left: 50%;
            top: 35%;
            transform: translate(-50%, -50%) scale(0.8);
            padding: 12px 28px;
            border-radius: 8px;
            background: rgba(18, 18, 20, 0.92);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            white-space: nowrap;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .banner.visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        .overlay[hidden] {
            display: none;
        }

        .dialog {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            min-width: 260px;
            padding: 28px 36px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .dialog-title {
            font-size: 2rem;
            letter-spacing: 4px;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .title-blue {
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        .dialog-text {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .dialog-score {
            font-weight: bold;
            color: #ffffff;
        }

        .button,
        .button-outline {
            padding: 10px 28px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #121214;
            background: #00f0ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .button:hover,
        .button-outline:hover {
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        .button:active,
        .button-outline:active {
            transform: scale(0.96);
        }

        .button:focus-visible,
        .button-outline:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        .dialog-buttons {
            display: flex;
            gap: 12px;
        }

        .button-outline {
            color: #00f0ff;
            background: transparent;
            border: 1px solid #00f0ff;
        }

        .level-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 100%;
        }

        .level-button {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 4px;
            width: 100%;
            padding: 12px 16px;
            font-family: inherit;
            text-align: left;
            color: #ffffff;
            background: #121214;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            cursor: pointer;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        .level-button:hover,
        .level-button:focus-visible {
            border-color: #00f0ff;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            outline: none;
        }

        .level-button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
            border-color: var(--panel-border);
            box-shadow: none;
        }

        .level-button:disabled .level-name {
            color: var(--text-muted);
        }

        .level-name {
            font-size: 1.1rem;
            font-weight: bold;
            color: #00f0ff;
        }

        .level-text {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .energy-bar {
            width: 100%;
            height: 12px;
            margin-top: 4px;
            background: #000000;
            border: 1px solid var(--panel-border);
            border-radius: 6px;
            overflow: hidden;
        }

        .energy-fill {
            width: 0;
            height: 100%;
            background: linear-gradient(90deg, #00f0ff, #ff007f);
            transition: width 0.3s ease;
        }

        .energy-text {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .small-button {
            width: 100%;
            margin-top: 4px;
            padding: 8px;
            font-family: inherit;
            font-weight: bold;
            color: #121214;
            background: #00f0ff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .small-button:hover {
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
        }

        .small-button:disabled {
            color: var(--text-muted);
            background: #2a2a38;
            box-shadow: none;
            cursor: not-allowed;
        }

        .control-buttons {
            display: flex;
            gap: 6px;
            width: 100%;
        }

        .skill-hint {
            max-width: 140px;
            font-size: 0.75rem;
            text-align: center;
            color: #ffe138;
        }

        .board.portal {
            border-left: 3px solid #b44dff;
            border-right: 3px solid #b44dff;
            box-shadow: -8px 0 16px -6px #b44dff, 8px 0 16px -6px #b44dff;
        }

        .board.aiming {
            cursor: crosshair;
        }

        .cell.target {
            box-shadow: inset 0 0 0 2px #ffffff;
            background-color: rgba(255, 255, 255, 0.25);
        }

        .key-guide {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="game">
    <h1>TETRIS</h1>

    <div class="play-area">
        <div class="board-wrapper">
            <div id="board" class="board" aria-label="Bàn chơi Tetris"></div>
            <div id="banner" class="banner" role="status" aria-live="polite"></div>
        </div>

        <aside class="side-panel">
            <div class="info-box">
                <span class="info-label">TIẾP THEO</span>
                <div id="next" class="next-grid" aria-label="Khối tiếp theo"></div>
            </div>
            <div class="info-box">
                <span class="info-label">SỐ ĐIỂM</span>
                <span id="score" class="info-value score-value">0</span>
            </div>
            <div class="info-box">
                <span class="info-label">LEVEL</span>
                <span id="level" class="info-value level-value">1</span>
            </div>
            <div class="info-box">
                <div class="control-buttons">
                    <button id="pause-button" class="small-button" type="button" onclick="pauseGame()">Tạm dừng</button>
                    <button id="restart-button" class="small-button" type="button" onclick="restartGame()">Chơi lại</button>
                </div>
            </div>
            <div id="energy-box" class="info-box" hidden>
                <span class="info-label">NĂNG LƯỢNG</span>
                <div class="energy-bar">
                    <div id="energy-fill" class="energy-fill"></div>
                </div>
                <span id="energy-text" class="energy-text">0 / 100</span>
            </div>
            <div id="skill-box" class="info-box" hidden>
                <span class="info-label">KỸ NĂNG</span>
                <button id="skill-row" class="small-button" type="button" onclick="useSkill('row')">Phá 1 hàng</button>
                <button id="skill-area" class="small-button" type="button" onclick="useSkill('area')">Nổ 2x2</button>
                <span id="skill-hint" class="skill-hint"></span>
            </div>
        </aside>
    </div>

    <div class="key-guide">
        <p>A D : Di chuyển sang trái/phải</p>
        <p>Space : Xoay khối hình</p>
        <p>S : Thả rơi nhanh</p>
        <p>P : Tạm dừng / tiếp tục</p>
        <p>Ctrl + Enter : Qua màn</p>
    </div>
</div>

<div id="pause-menu" class="overlay" role="dialog" aria-modal="true" aria-labelledby="pause-title" hidden>
    <div class="dialog">
        <h2 id="pause-title" class="dialog-title title-blue">TẠM DỪNG</h2>
        <div class="dialog-buttons">
            <button id="resume-button" class="button" type="button" onclick="resumeGame()">Tiếp tục</button>
            <button class="button-outline" type="button" onclick="restartGame()">Chơi lại</button>
            <button class="button-outline" type="button" onclick="showMenu()">Chọn màn</button>
        </div>
    </div>
</div>

<div id="game-over" class="overlay" role="dialog" aria-modal="true" aria-labelledby="game-over-title" hidden>
    <div class="dialog">
        <h2 id="game-over-title" class="dialog-title">GAME OVER</h2>
        <p class="dialog-text">Điểm của bạn: <span id="final-score" class="dialog-score">0</span></p>
        <div class="dialog-buttons">
            <button id="again-button" class="button" type="button" onclick="startGame()">Chơi lại</button>
            <button class="button-outline" type="button" onclick="showMenu()">Chọn màn</button>
        </div>
    </div>
</div>

<div id="level-menu" class="overlay" role="dialog" aria-modal="true" aria-labelledby="level-menu-title" hidden>
    <div class="dialog">
        <h2 id="level-menu-title" class="dialog-title title-blue">CHỌN MÀN</h2>
        <div class="level-list">
            <button id="level-1-button" class="level-button" type="button" onclick="chooseLevel(1)">
                <span class="level-name">Level 1</span>
                <span id="level-1-text" class="level-text">Chơi cơ bản</span>
            </button>
            <button id="level-2-button" class="level-button" type="button" onclick="chooseLevel(2)">
                <span class="level-name">Level 2</span>
                <span id="level-2-text" class="level-text"></span>
            </button>
            <button id="level-3-button" class="level-button" type="button" onclick="chooseLevel(3)">
                <span class="level-name">Level 3</span>
                <span id="level-3-text" class="level-text"></span>
            </button>
            <button id="level-4-button" class="level-button" type="button" onclick="chooseLevel(4)">
                <span class="level-name">Level 4</span>
                <span id="level-4-text" class="level-text"></span>
            </button>
            <button id="level-5-button" class="level-button" type="button" onclick="chooseLevel(5)">
                <span class="level-name">Level 5</span>
                <span id="level-5-text" class="level-text"></span>
            </button>
            <button id="level-6-button" class="level-button" type="button" onclick="chooseLevel(6)">
                <span class="level-name">Level 6</span>
                <span id="level-6-text" class="level-text"></span>
            </button>
        </div>
    </div>
</div>

<script src="game.js"></script>
</body>
</html>
