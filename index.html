<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <h1>TETRIS</h1>


    <div class="play-area">
        <div class="board-wrapper">
            <div id="board" class="board" aria-label="Bàn chơi Tetris"></div>
            <!-- Thông báo "Level Up", JS bật/tắt class is-visible -->
            <div id="level-banner" class="level-banner" role="status" aria-live="polite"></div>
        </div>

        <aside class="side-panel">
            <div class="stat">
                <span class="stat-label">TIẾP THEO</span>
                <div id="next" class="next-grid" aria-label="Khối tiếp theo"></div>
            </div>
            <div class="stat">
                <span class="stat-label">SỐ ĐIỂM</span>
                <span id="score" class="stat-value stat-value--score">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">LEVEL</span>
                <span id="level" class="stat-value stat-value--level">1</span>
            </div>
        </aside>
    </div>

    <div class="controls-hint">
        <p>A D : Di chuyển sang trái/phải</p>
        <p>Space : Xoay khối hình</p>
        <p>S : Thả rơi nhanh</p>
    </div>
</div>

<div id="game-over" class="overlay" role="dialog" aria-modal="true" aria-labelledby="game-over-title" hidden>
    <div class="dialog">
        <h2 id="game-over-title" class="dialog-title">GAME OVER</h2>
        <p class="dialog-text">Điểm của bạn: <span id="final-score" class="dialog-score">0</span></p>
        <button id="restart-button" class="button" type="button">Chơi lại</button>
    </div>
</div>

<script src="gamemode.js"></script>
</body>
</html>
