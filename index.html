<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tetris</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --cols: 10;
            --rows: 20;
            --cell-size: 30px;

            /* Màu theo id khối, khớp với giá trị trong PIECES ở gamemode.js */
            --c1: #FF8E0D; /* I */
            --c2: #0DFF72; /* L */
            --c3: #F538FF; /* J */
            --c4: #0DC2FF; /* O */
            --c5: #3877FF; /* Z */
            --c6: #FFE138; /* S */
            --c7: #FF0D72; /* T */
            --c8: #6B6B80; /* Hàng rác ở Level 2 */

            --panel-bg: #1a1a24;
            --panel-border: #33334d;
            --text-muted: #8888a0;
        }

        body {
            background-color: #121214;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        h1 {
            font-size: 2.5rem;
            letter-spacing: 4px;
            color: #00f0ff;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
        }

        /* ===== Bố cục: bàn chơi bên trái, bảng thông tin bên phải ===== */
        .play-area {
            display: flex;
            align-items: flex-start;
            gap: 16px;
        }

        /* Khung định vị cho thông báo Level Up nằm đè lên bàn chơi */
        .board-wrapper {
            position: relative;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 140px;
        }

        .stat {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 8px;
        }

        .stat-label {
            font-size: 0.8rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-muted);
        }

        .stat-value {
            font-size: 1.5rem;
            font-weight: bold;
        }

        .stat-value--score {
            color: #ff007f;
        }

        .stat-value--level {
            color: #00f0ff;
        }

        /* Lưới 4x4 xem trước khối kế tiếp, dùng chung kích thước ô với bàn chơi */
        .next-grid {
            display: grid;
            grid-template-columns: repeat(4, var(--cell-size));
            grid-template-rows: repeat(4, var(--cell-size));
            margin-top: 4px;
        }

        /* ===== Bàn chơi ===== */
        .board {
            display: grid;
            grid-template-columns: repeat(var(--cols), var(--cell-size));
            grid-template-rows: repeat(var(--rows), var(--cell-size));
            background-color: #000000;
            border: 3px solid var(--panel-border);
            border-radius: 6px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            user-select: none;
        }

        .cell {
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.04);
        }

        .cell:not([data-v="0"]) {
            box-shadow: inset 0 0 0 1px #000, inset 0 0 0 3px rgba(255, 255, 255, 0.15);
        }

        .cell[data-v="1"] { background-color: var(--c1); }
        .cell[data-v="2"] { background-color: var(--c2); }
        .cell[data-v="3"] { background-color: var(--c3); }
        .cell[data-v="4"] { background-color: var(--c4); }
        .cell[data-v="5"] { background-color: var(--c5); }
        .cell[data-v="6"] { background-color: var(--c6); }
        .cell[data-v="7"] { background-color: var(--c7); }
        .cell[data-v="8"] { background-color: var(--c8); }

        /* ===== Thông báo Level Up ===== */
        .level-banner {
            position: absolute;
            left: 50%;
            top: 35%;
            transform: translate(-50%, -50%) scale(0.8);
            padding: 12px 28px;
            border-radius: 8px;
            background: rgba(18, 18, 20, 0.92);
            border: 1px solid #00f0ff;
            color: #00f0ff;
            font-size: 1.6rem;
            font-weight: bold;
            letter-spacing: 3px;
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.6);
            white-space: nowrap;
            pointer-events: none; /* Không chặn thao tác lên bàn chơi */
            opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        .level-banner.is-visible {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        /* ===== Popup Game Over ===== */
        /* Phủ toàn màn hình, nền tối mờ để làm nổi hộp thoại và chặn click xuống game */
        .overlay {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.7);
            z-index: 10;
        }

        /* display: flex ở trên sẽ đè thuộc tính hidden, nên phải ẩn lại tường minh */
        .overlay[hidden] {
            display: none;
        }

        .dialog {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            min-width: 260px;
            padding: 28px 36px;
            background: var(--panel-bg);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }

        .dialog-title {
            font-size: 2rem;
            letter-spacing: 4px;
            color: #ff007f;
            text-shadow: 0 0 10px rgba(255, 0, 127, 0.5);
        }

        .dialog-text {
            font-size: 1.1rem;
            color: var(--text-muted);
        }

        .dialog-score {
            font-weight: bold;
            color: #ffffff;
        }

        .button {
            padding: 10px 28px;
            font-family: inherit;
            font-size: 1rem;
            font-weight: bold;
            letter-spacing: 1px;
            color: #121214;
            background: #00f0ff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .button:hover {
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
        }

        .button:active {
            transform: scale(0.96);
        }

        /* Viền focus rõ ràng khi dùng bàn phím (Tab/Enter) */
        .button:focus-visible {
            outline: 2px solid #ffffff;
            outline-offset: 3px;
        }

        .controls-hint {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-muted);
            line-height: 1.5;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>TETRIS</h1>


    <div class="play-area">
        <div class="board-wrapper">
            <div id="board" class="board" aria-label="Bàn chơi Tetris"></div>
            <!-- Thông báo "Level Up", JS bật/tắt class is-visible -->
            <div id="level-banner" class="level-banner" role="status" aria-live="polite"></div>
        </div>

        <aside class="side-panel">
            <div class="stat">
                <span class="stat-label">TIẾP THEO</span>
                <div id="next" class="next-grid" aria-label="Khối tiếp theo"></div>
            </div>
            <div class="stat">
                <span class="stat-label">SỐ ĐIỂM</span>
                <span id="score" class="stat-value stat-value--score">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">LEVEL</span>
                <span id="level" class="stat-value stat-value--level">1</span>
            </div>
        </aside>
    </div>

    <div class="controls-hint">
        <p>A D : Di chuyển sang trái/phải</p>
        <p>Space : Xoay khối hình</p>
        <p>S : Thả rơi nhanh</p>
    </div>
</div>

<div id="game-over" class="overlay" role="dialog" aria-modal="true" aria-labelledby="game-over-title" hidden>
    <div class="dialog">
        <h2 id="game-over-title" class="dialog-title">GAME OVER</h2>
        <p class="dialog-text">Điểm của bạn: <span id="final-score" class="dialog-score">0</span></p>
        <button id="restart-button" class="button" type="button">Chơi lại</button>
    </div>
</div>

<script src="gamemode.js"></script>
</body>
</html>
