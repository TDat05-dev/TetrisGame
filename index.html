<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tetris</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
    <h1>TETRIS</h1>


    <div class="play-area">
        <div class="board-wrapper">
            <div id="board" class="board" aria-label="Bàn chơi Tetris"></div>
            <div id="level-banner" class="level-banner" role="status" aria-live="polite"></div>
        </div>

        <aside class="side-panel">
            <div class="stat">
                <span class="stat-label">SỐ ĐIỂM</span>
                <span id="score" class="stat-value stat-value--score">0</span>
            </div>
            <div class="stat">
                <span class="stat-label">LEVEL</span>
                <span id="level" class="stat-value stat-value--level">1</span>
            </div>
        </aside>
    </div>

    <div class="controls-hint">
        <p>A D : Di chuyển sang trái/phải</p>
        <p>W / Click : Xoay khối hình</p>
        <p>S : Thả rơi nhanh</p>
    </div>
</div>

<script src="gamemode.js"></script>
</body>
</html>
